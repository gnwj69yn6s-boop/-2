<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>VELORA FIZZ - 9s Brand Ad</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#020817;font-family:Arial,Helvetica,sans-serif}
#ad{position:relative;width:100vw;height:100vh;background:radial-gradient(circle at 70% 20%,rgba(25,45,90,.35),transparent 35%),linear-gradient(135deg,#020817 0%,#07162c 55%,#020610 100%);overflow:hidden}
.scene{position:absolute;inset:0;opacity:0;pointer-events:none}
.glow{position:absolute;border-radius:50%;filter:blur(40px)}

#scene1{opacity:1;animation:scene1Fade 9s linear infinite}
.window{position:absolute;right:8%;top:8%;width:28%;height:42%;border:2px solid rgba(255,255,255,.08);background:linear-gradient(150deg,rgba(80,110,180,.16),rgba(255,255,255,.01));box-shadow:0 0 80px rgba(40,90,190,.08)}
.window:before{content:"";position:absolute;left:50%;width:2px;height:100%;background:rgba(255,255,255,.05)}
.table{position:absolute;width:75%;height:23%;left:12%;bottom:12%;border-radius:8px;transform:perspective(700px) rotateX(58deg);background:linear-gradient(180deg,#152034,#060c17);box-shadow:0 -15px 50px rgba(255,255,255,.02),0 25px 70px rgba(0,0,0,.7)}
.laptop{position:absolute;width:24%;height:14%;left:20%;bottom:30%;border-radius:7px;background:linear-gradient(145deg,#202a3c,#090e19);border:1px solid rgba(255,255,255,.08);transform:skewX(-8deg);box-shadow:0 20px 25px rgba(0,0,0,.35)}
.phone{position:absolute;width:5%;height:12%;left:53%;bottom:28%;border-radius:10px;transform:rotate(12deg);background:linear-gradient(145deg,#1b2231,#040810);border:1px solid rgba(255,255,255,.15)}
.ambient-light{width:240px;height:240px;top:12%;left:20%;background:rgba(12,72,255,.16)}

.can-wrap{position:absolute;left:50%;top:50%;width:150px;height:360px;transform:translate(-50%,-50%)}
.can{position:absolute;inset:0;border-radius:28px 28px 22px 22px;background:linear-gradient(90deg,#0b1427 0%,#263750 22%,#0a1224 48%,#35445f 70%,#080f20 100%);box-shadow:inset 12px 0 20px rgba(255,255,255,.06),inset -15px 0 25px rgba(0,0,0,.55),0 30px 80px rgba(0,0,0,.75)}
.can-top{position:absolute;top:-9px;left:4px;right:4px;height:23px;border-radius:50%;background:linear-gradient(180deg,#e9eef3,#7e8994)}
.can-bottom{position:absolute;bottom:-5px;left:5px;right:5px;height:16px;border-radius:50%;background:#68737d;opacity:.55}
.brand{position:absolute;top:34%;width:100%;color:#fff;text-align:center;font-size:25px;letter-spacing:5px;font-weight:700}
.fizz{display:block;color:#ffe14d;font-size:19px;margin-top:6px;letter-spacing:9px}
.yellow-line{position:absolute;width:4px;height:68%;right:19px;top:15%;border-radius:50px;background:linear-gradient(#ffe44a,#ffbf00);box-shadow:0 0 20px #ffd51c}
.reflection{position:absolute;left:20px;top:30px;width:14px;height:285px;border-radius:50%;background:linear-gradient(rgba(255,255,255,.25),rgba(255,255,255,.02));filter:blur(4px)}
.drop{position:absolute;background:rgba(255,255,255,.5);border-radius:50%;box-shadow:inset -2px -2px 3px rgba(0,0,0,.25),0 0 5px rgba(255,255,255,.15)}
.d1{width:9px;height:12px;left:25px;top:58px}.d2{width:6px;height:8px;right:30px;top:90px}.d3{width:12px;height:15px;left:45px;top:170px}.d4{width:7px;height:10px;right:19px;top:235px}.d5{width:5px;height:7px;left:35px;bottom:43px}

#scene2{animation:scene2Fade 9s linear infinite}
#scene2 .can-wrap{transform:translate(-50%,-50%) scale(.75);animation:canEntrance 9s cubic-bezier(.3,.8,.2,1) infinite}
.product-halo{width:420px;height:420px;left:calc(50% - 210px);top:calc(50% - 210px);background:rgba(255,217,43,.17);filter:blur(80px)}
.finger{position:absolute;width:120px;height:280px;right:29%;top:33%;border-radius:80px;background:linear-gradient(90deg,#bd856f,#e5b09a);transform:rotate(-22deg) translateX(250px);opacity:0;animation:handMovement 9s ease-in-out infinite}
.tab{position:absolute;width:52px;height:22px;border-radius:50%;background:#6e767e;left:49px;top:-4px;transform:rotate(-10deg);border:3px solid #c5cbd0}
.fizz-cloud{position:absolute;width:170px;height:120px;left:calc(50% - 85px);top:calc(50% - 225px);border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.8),transparent 65%);filter:blur(10px);opacity:0;animation:fizzCloud 9s linear infinite}

#scene3{animation:scene3Fade 9s linear infinite;background:radial-gradient(circle at center,#ffd933 0%,#d8a900 25%,#061027 75%)}
#scene3 .can-wrap{transform:translate(-50%,-50%) scale(.78);animation:scene3Can 9s ease-out infinite}
.bubble{position:absolute;border-radius:50%;border:2px solid rgba(255,255,255,.8);background:radial-gradient(circle at 35% 25%,rgba(255,255,255,.9),rgba(255,255,255,.08));box-shadow:0 0 18px rgba(255,255,255,.35);opacity:0}
.b1{width:75px;height:75px;left:15%;top:62%;animation:bubble1 9s ease-out infinite}.b2{width:45px;height:45px;left:30%;top:75%;animation:bubble2 9s ease-out infinite}.b3{width:100px;height:100px;right:15%;top:55%;animation:bubble3 9s ease-out infinite}.b4{width:38px;height:38px;right:30%;top:70%;animation:bubble4 9s ease-out infinite}
.lemon{position:absolute;width:150px;height:150px;border-radius:50%;background:radial-gradient(circle,#fff4a6 0 15%,#ffe95a 16% 66%,#ffd51c 67% 82%,#f7b900 83%);border:8px solid #ffde31;opacity:0}
.lemon:before,.lemon:after{content:"";position:absolute;background:rgba(255,255,255,.55);left:50%;top:8px;width:3px;height:134px;transform-origin:center}
.lemon:after{transform:rotate(90deg)}
.lemon1{left:15%;top:25%;animation:lemonMove1 9s ease-out infinite}.lemon2{right:13%;bottom:20%;width:100px;height:100px;animation:lemonMove2 9s ease-out infinite}
.copy{position:absolute;width:100%;bottom:10%;text-align:center;font-size:clamp(26px,3vw,52px);font-weight:300;letter-spacing:8px;color:white;text-shadow:0 4px 30px rgba(0,0,0,.25);opacity:0;animation:copyShow 9s linear infinite}

#scene4{animation:scene4Fade 9s linear infinite;background:radial-gradient(circle at 50% 45%,#6c6316 0%,#172240 26%,#030817 62%)}
.hero-halo{position:absolute;width:520px;height:520px;border-radius:50%;left:calc(50% - 260px);top:calc(45% - 260px);background:radial-gradient(circle,rgba(255,230,70,.75),rgba(255,190,0,.2) 38%,transparent 70%);filter:blur(20px);animation:haloPulse 9s ease-in-out infinite}
#scene4 .can-wrap{top:43%;animation:heroCan 9s ease-out infinite}
.end-text{position:absolute;left:0;right:0;bottom:7%;text-align:center;opacity:0;animation:endText 9s linear infinite}
.logo-text{font-size:clamp(28px,3vw,54px);color:white;letter-spacing:10px;font-weight:700}
.tagline{color:rgba(255,255,255,.76);font-size:clamp(12px,1.4vw,22px);letter-spacing:5px;margin-top:10px}
.shop{margin:18px auto 0;display:inline-block;padding:10px 29px;border:1px solid #ffe14f;color:#ffe14f;font-size:13px;letter-spacing:5px;border-radius:50px}

@keyframes scene1Fade{0%{opacity:1;transform:scale(1)}18%{opacity:1}22%{opacity:0;transform:scale(1.04)}100%{opacity:0}}
@keyframes scene2Fade{0%,20%{opacity:0}22%{opacity:1}43%{opacity:1}47%{opacity:0}100%{opacity:0}}
@keyframes canEntrance{0%,20%{transform:translate(-50%,-40%) scale(.68);opacity:0}25%{transform:translate(-50%,-50%) scale(.82);opacity:1}42%{transform:translate(-50%,-50%) scale(.9);opacity:1}100%{opacity:0}}
@keyframes handMovement{0%,24%{opacity:0;transform:rotate(-22deg) translateX(250px)}29%{opacity:1;transform:rotate(-22deg) translateX(50px)}36%{opacity:1;transform:rotate(-25deg) translateX(15px)}40%{opacity:0;transform:rotate(-28deg) translateX(-30px)}100%{opacity:0}}
@keyframes fizzCloud{0%,30%{opacity:0;transform:scale(.2)}34%{opacity:.9;transform:scale(1)}43%{opacity:0;transform:scale(2.4)}100%{opacity:0}}
@keyframes scene3Fade{0%,43%{opacity:0}46%{opacity:1}69%{opacity:1}73%{opacity:0}100%{opacity:0}}
@keyframes scene3Can{0%,45%{transform:translate(-50%,-50%) scale(.7)}66%{transform:translate(-50%,-50%) scale(.98)}100%{transform:translate(-50%,-50%) scale(1)}}
@keyframes bubble1{0%,45%{opacity:0;transform:translate(0,0) scale(.2)}50%{opacity:1}68%{opacity:0;transform:translate(-200px,-350px) scale(1.6)}100%{opacity:0}}
@keyframes bubble2{0%,46%{opacity:0;transform:scale(.1)}52%{opacity:1}68%{opacity:0;transform:translate(-70px,-400px) scale(2)}100%{opacity:0}}
@keyframes bubble3{0%,45%{opacity:0;transform:scale(.2)}50%{opacity:.9}68%{opacity:0;transform:translate(220px,-300px) scale(1.9)}100%{opacity:0}}
@keyframes bubble4{0%,46%{opacity:0;transform:scale(.2)}51%{opacity:1}68%{opacity:0;transform:translate(100px,-440px) scale(2.2)}100%{opacity:0}}
@keyframes lemonMove1{0%,45%{opacity:0;transform:translate(250px,300px) rotate(0) scale(.3)}50%{opacity:1}68%{opacity:.85;transform:translate(-80px,-130px) rotate(250deg) scale(1.2)}72%{opacity:0}100%{opacity:0}}
@keyframes lemonMove2{0%,45%{opacity:0;transform:translate(-180px,100px) rotate(0) scale(.3)}52%{opacity:1}69%{opacity:.9;transform:translate(130px,-180px) rotate(-280deg) scale(1.4)}73%{opacity:0}100%{opacity:0}}
@keyframes copyShow{0%,50%{opacity:0;transform:translateY(20px)}55%{opacity:1;transform:translateY(0)}67%{opacity:1}71%{opacity:0}100%{opacity:0}}
@keyframes scene4Fade{0%,69%{opacity:0}73%{opacity:1}100%{opacity:1}}
@keyframes heroCan{0%,70%{transform:translate(-50%,-50%) scale(.72);opacity:0}76%{transform:translate(-50%,-50%) scale(.82);opacity:1}100%{transform:translate(-50%,-50%) scale(.94);opacity:1}}
@keyframes haloPulse{0%,70%{transform:scale(.5);opacity:0}78%{opacity:.8}100%{transform:scale(1.15);opacity:1}}
@keyframes endText{0%,76%{opacity:0;transform:translateY(15px)}82%{opacity:1;transform:translateY(0)}100%{opacity:1}}

.controls{position:fixed;right:18px;bottom:18px;z-index:1000}
button{padding:10px 16px;border-radius:999px;border:1px solid rgba(255,255,255,.2);background:rgba(0,0,0,.45);backdrop-filter:blur(10px);color:white;cursor:pointer;font-size:13px}
button:hover{background:rgba(255,255,255,.12)}
</style>
</head>
<body>
<div id="ad">
  <section class="scene" id="scene1">
    <div class="glow ambient-light"></div>
    <div class="window"></div><div class="laptop"></div><div class="phone"></div><div class="table"></div>
  </section>

  <section class="scene" id="scene2">
    <div class="glow product-halo"></div>
    <div class="can-wrap"><div class="can"><div class="can-top"></div><div class="tab"></div><div class="reflection"></div><div class="yellow-line"></div><div class="brand">VELORA<span class="fizz">FIZZ</span></div><div class="drop d1"></div><div class="drop d2"></div><div class="drop d3"></div><div class="drop d4"></div><div class="drop d5"></div><div class="can-bottom"></div></div></div>
    <div class="finger"></div><div class="fizz-cloud"></div>
  </section>

  <section class="scene" id="scene3">
    <div class="can-wrap"><div class="can"><div class="can-top"></div><div class="reflection"></div><div class="yellow-line"></div><div class="brand">VELORA<span class="fizz">FIZZ</span></div><div class="drop d1"></div><div class="drop d2"></div><div class="drop d3"></div><div class="can-bottom"></div></div></div>
    <div class="bubble b1"></div><div class="bubble b2"></div><div class="bubble b3"></div><div class="bubble b4"></div>
    <div class="lemon lemon1"></div><div class="lemon lemon2"></div>
    <div class="copy">MAKE IT EXTRAORDINARY.</div>
  </section>

  <section class="scene" id="scene4">
    <div class="hero-halo"></div>
    <div class="can-wrap"><div class="can"><div class="can-top"></div><div class="reflection"></div><div class="yellow-line"></div><div class="brand">VELORA<span class="fizz">FIZZ</span></div><div class="drop d1"></div><div class="drop d2"></div><div class="drop d3"></div><div class="drop d4"></div><div class="drop d5"></div><div class="can-bottom"></div></div></div>
    <div class="end-text"><div class="logo-text">VELORA FIZZ</div><div class="tagline">MAKE IT EXTRAORDINARY.</div><div class="shop">SHOP NOW</div></div>
  </section>
</div>

<div class="controls"><button onclick="restartAd()">↻ Replay 9s</button></div>

<script>
function restartAd(){
  const ad=document.getElementById("ad");
  const clone=ad.cloneNode(true);
  ad.parentNode.replaceChild(clone,ad);
}
</script>
</body>
</html>
